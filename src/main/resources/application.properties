
spring.profiles.active=dev
server.port=9096

# HikariCP — larger pool so SSE streams don't starve short-lived DB requests
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

spring.application.name=wordy

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

file.storage.path=uploads

jwt.secret=wordy-super-secret-key-must-be-at-least-32-chars!!
jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=wp.finki.wordy.web.controller

